name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "Update flake.lock"
          # Pull requests opened with GITHUB_TOKEN do not trigger CI. To run
          # it automatically, pass a GitHub App or fine-grained PAT token with
          # contents and pull-requests write access, e.g.
          # token: ${{ secrets.FLAKE_LOCK_TOKEN }}
